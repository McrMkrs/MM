<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>I LOVE YOU</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      position:relative;

      background: linear-gradient(-45deg, #ff4d6d, #ff758f, #ff8fa3, #ffc2d1);
      background-size:400% 400%;
      animation:gradientMove 10s ease infinite;
    }

    @keyframes gradientMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .container{
      z-index:2;
      width:100%;
      max-width:500px;
      animation:fadeIn 2s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size: clamp(2.5rem, 9vw, 5rem);
      color:white;
      line-height:1.2;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.7),
        0 0 40px rgba(255,0,102,0.8);

      animation:pulse 2s infinite;
      word-wrap:break-word;
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
    }

    p{
      margin-top:15px;
      color:white;
      font-size:1.1rem;
      opacity:0.95;
      padding:0 10px;
    }

    .glow-btn{
      margin-top:30px;
      padding:14px 35px;
      border:none;
      border-radius:50px;
      background:white;
      color:#ff4d6d;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;

      transition:0.3s ease;
      box-shadow:0 0 15px rgba(255,255,255,0.8);

      -webkit-tap-highlight-color: transparent;
    }

    .glow-btn:active{
      transform:scale(0.95);
    }

    .glow-btn:hover{
      box-shadow:0 0 25px rgba(255,255,255,1);
    }

    /* Floating Hearts */
    .heart{
      position:absolute;
      bottom:-50px;
      color:rgba(255,255,255,0.8);
      animation:floatUp linear forwards;
      pointer-events:none;
    }

    @keyframes floatUp{
      0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
      }

      100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    /* Mobile Optimization */
    @media (max-width:600px){

      h1{
        font-size:2.7rem;
      }

      p{
        font-size:1rem;
      }

      .glow-btn{
        width:85%;
        max-width:280px;
        font-size:1rem;
      }
    }

  </style>
</head>

<body>

  <div class="container">
    <h1>I LOVE YOU, BABY! 💛</h1>

    <p>
      You are my happiness every single day ✨
    </p>

    <button class="glow-btn" onclick="showMessage()">
      Click Me 💖
    </button>
  </div>

  <script>
    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");

      heart.classList.add("heart");
      heart.innerHTML = ["💖","💛","💗","❤️"][Math.floor(Math.random()*4)];

      heart.style.left = Math.random() * window.innerWidth + "px";

      heart.style.fontSize = (Math.random() * 25 + 15) + "px";

      heart.style.animationDuration = (Math.random() * 4 + 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    // Better performance on mobile
    setInterval(createHeart, 400);

    // Button Message
    function showMessage(){
      alert("💖 I LOVE YOU FOREVER 💖");
    }
  </script>

</body>
</html>
